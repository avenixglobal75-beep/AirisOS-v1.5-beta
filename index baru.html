<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AIRIS OS Simulator</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#device{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}


/* =========================================================
   STATUS BAR
========================================================= */

.statusbar{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:32px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 13px;

    color:#fff;

    font-size:13px;
    font-weight:600;

    z-index:9000;

    pointer-events:none;
}

.status-left,
.status-right{
    display:flex;

    align-items:center;

    gap:7px;
}

.signal{
    display:flex;

    align-items:flex-end;

    gap:2px;

    height:13px;
}

.signal span{
    width:3px;

    background:#fff;

    border-radius:3px;
}

.signal span:nth-child(1){
    height:4px;
}

.signal span:nth-child(2){
    height:7px;
}

.signal span:nth-child(3){
    height:10px;
}

.signal span:nth-child(4){
    height:13px;
}

.wifi{
    font-size:18px;
}

.battery{
    width:23px;
    height:12px;

    border:1.5px solid #fff;

    border-radius:3px;

    position:relative;
}

.battery:after{
    content:"";

    position:absolute;

    right:-4px;
    top:3px;

    width:2px;
    height:5px;

    background:#fff;

    border-radius:1px;
}

.battery-fill{
    position:absolute;

    left:1px;
    top:1px;
    bottom:1px;

    width:70%;

    background:#fff;

    border-radius:1px;
}


/* =========================================================
   LOCK SCREEN
========================================================= */

#lockScreen{
    position:absolute;

    inset:0;

    z-index:8000;

    overflow:hidden;

    color:#fff;

    background:
        linear-gradient(
            to bottom,
            #303235 0%,
            #202123 45%,
            #171819 100%
        );

    touch-action:none;

    transition:
        transform .55s cubic-bezier(.22,.8,.25,1),
        opacity .4s ease;
}

.landscape{
    position:absolute;

    left:-10%;
    right:-10%;

    bottom:-3%;

    height:45%;

    background:
        linear-gradient(
            160deg,
            #151617 0%,
            #3b3d3f 42%,
            #686a6c 43%,
            #292a2b 100%
        );

    border-radius:50% 50% 0 0;

    transform:rotate(-3deg);
}

.landscape:after{
    content:"";

    position:absolute;

    left:30%;
    right:-10%;

    bottom:8%;

    height:45%;

    background:
        linear-gradient(
            165deg,
            #252627,
            #55575a 48%,
            #77797b
        );

    border-radius:50% 50% 0 0;
}

.lockContent{
    position:absolute;

    top:78px;

    left:0;
    right:0;

    text-align:center;

    z-index:5;
}

.lockDate{
    font-size:23px;

    font-weight:600;

    margin-bottom:5px;
}

.lockTime{
    font-size:clamp(85px,25vw,145px);

    line-height:.9;

    font-weight:300;

    letter-spacing:-6px;

    color:rgba(255,255,255,.72);
}

.lockButtons{
    position:absolute;

    left:0;
    right:0;

    bottom:32px;

    display:flex;

    justify-content:space-between;

    padding:0 48px;

    z-index:10;
}

.lockButton{
    width:59px;
    height:59px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(255,255,255,.22);

    border:1px solid rgba(255,255,255,.3);

    font-size:25px;
}

.swipeHint{
    position:absolute;

    bottom:105px;

    left:0;
    right:0;

    text-align:center;

    font-size:13px;

    color:rgba(255,255,255,.75);

    z-index:10;

    pointer-events:none;
}

.swipeArrow{
    font-size:25px;

    margin-bottom:4px;

    animation:floatArrow 1.5s infinite ease-in-out;
}

@keyframes floatArrow{

    0%,
    100%{
        transform:translateY(5px);
    }

    50%{
        transform:translateY(-5px);
    }

}

#lockScreen.unlocking{
    transform:translateY(-100%);

    opacity:0;

    pointer-events:none;
}


/* =========================================================
   HOME SCREEN
========================================================= */

#homeScreen{
    position:absolute;

    inset:0;

    opacity:0;

    background:
        linear-gradient(
            135deg,
            #737578,
            #a2a4a6 45%,
            #686a6c
        );

    transition:opacity .3s ease;

    z-index:100;

    overflow:hidden;
}

#homeScreen.visible{
    opacity:1;
}

.homeBackground{
    position:absolute;

    inset:0;

    background:
        radial-gradient(
            ellipse at 20% 25%,
            rgba(255,255,255,.18),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 80% 70%,
            rgba(0,0,0,.16),
            transparent 40%
        );
}


/* =========================================================
   HOME APP GRID
========================================================= */

.homeScroll{
    position:absolute;

    top:32px;
    left:0;
    right:0;
    bottom:0;

    padding:
        40px 10px 80px;

    overflow-y:auto;

    overflow-x:hidden;

    scrollbar-width:none;
}

.homeScroll::-webkit-scrollbar{
    display:none;
}

.appGrid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    column-gap:3px;

    row-gap:21px;

    width:100%;
}

.app{
    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    touch-action:manipulation;
}

.appHitbox{
    width:78px;
    max-width:100%;

    padding:3px;

    display:flex;

    flex-direction:column;

    align-items:center;

    border-radius:18px;
}

.appIcon{
    width:58px;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:rgba(255,255,255,.36);

    border:1px solid rgba(255,255,255,.35);

    box-shadow:
        0 4px 14px rgba(0,0,0,.15);

    color:#fff;

    font-size:25px;

    font-weight:600;

    text-shadow:
        0 1px 3px rgba(0,0,0,.3);

    transition:transform .12s ease;
}

.app:active .appIcon{
    transform:scale(.9);
}

.appName{
    width:86px;
    max-width:100%;

    margin-top:5px;

    text-align:center;

    color:#fff;

    font-size:12px;

    line-height:15px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    text-shadow:
        0 1px 3px rgba(0,0,0,.55);
}


/* =========================================================
   APP WINDOW
========================================================= */

#appWindow{
    position:fixed;

    z-index:5000;

    left:0;
    top:0;

    width:10px;
    height:10px;

    background:#fff;

    border-radius:17px;

    overflow:hidden;

    visibility:hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;
}

#appWindow.open{
    visibility:visible;
}

.appContent{
    position:absolute;

    inset:0;

    background:#fff;

    color:#111;

    opacity:0;

    overflow:auto;

    transition:opacity .12s ease;

    padding-bottom:65px;
}

#appWindow.showContent .appContent{
    opacity:1;
}


/* =========================================================
   APP CONTENT
========================================================= */

.appHeader{
    height:65px;

    display:flex;

    align-items:center;

    padding:0 20px;

    border-bottom:1px solid #eee;

    font-size:20px;

    font-weight:600;
}

.appBody{
    padding:22px 18px;
}

.card{
    padding:18px;

    margin-bottom:14px;

    border-radius:18px;

    background:#f3f3f3;
}

.cardTitle{
    font-size:19px;

    font-weight:600;

    margin-bottom:7px;
}

.cardText{
    color:#777;

    font-size:14px;

    line-height:20px;
}


/* =========================================================
   SETTINGS
========================================================= */

.settingRow{
    min-height:60px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid #eee;
}

.settingLabel{
    font-size:16px;
}

.settingValue{
    color:#888;

    font-size:14px;
}

.speedButtons{
    display:flex;

    gap:7px;

    margin-top:12px;
}

.speedButton{
    border:0;

    padding:9px 13px;

    border-radius:12px;

    background:#eee;

    color:#222;
}

.speedButton.active{
    background:#222;

    color:#fff;
}


/* =========================================================
   AIRIS SYSTEM NAVIGATION
========================================================= */

/*
   INI NAVIGASI SISTEM SIMULATOR.

   Selalu berada di atas aplikasi.
   Tidak ada di lock screen.
*/

#systemNavigation{
    position:fixed;

    left:0;
    right:0;

    bottom:0;

    height:38px;

    z-index:10000;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;

    opacity:0;

    transition:opacity .2s ease;
}

#systemNavigation.visible{
    opacity:1;
}

#navigationBar{
    width:92px;

    height:5px;

    border-radius:20px;

    background:#fff;

    box-shadow:
        0 1px 5px rgba(0,0,0,.35);

    pointer-events:auto;

    touch-action:none;

    transition:
        transform .12s ease,
        width .12s ease;
}

#navigationBar:active{
    transform:scaleX(.85);
}


/* =========================================================
   TOUCH BLOCKER
========================================================= */

#blocker{
    position:fixed;

    inset:0;

    z-index:7000;

    display:none;

    background:transparent;

    touch-action:none;
}

#blocker.active{
    display:block;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:360px){

    .appGrid{
        column-gap:0;
    }

    .appIcon{
        width:53px;
        height:53px;

        border-radius:16px;
    }

    .appHitbox{
        width:68px;
    }

    .appName{
        font-size:11px;

        width:78px;
    }

}

</style>
</head>


<body>


<div id="device">


<!-- =====================================================
     STATUS BAR
===================================================== -->

<div class="statusbar">

    <div class="status-left">

        <span>4G</span>

        <div class="signal">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


    <div id="statusTime">
        20:45
    </div>


    <div class="status-right">

        <span class="wifi">
            ⌁
        </span>

        <div class="battery">

            <div class="battery-fill"></div>

        </div>

    </div>

</div>


<!-- =====================================================
     LOCK SCREEN
===================================================== -->

<section id="lockScreen">

    <div class="landscape"></div>


    <div class="lockContent">

        <div
            class="lockDate"
            id="lockDate"
        >
            Mon Jun 15
        </div>


        <div
            class="lockTime"
            id="lockTime"
        >
            16:07
        </div>

    </div>


    <div class="swipeHint">

        <div class="swipeArrow">
            ↑
        </div>

        <div>
            Geser ke atas untuk membuka
        </div>

    </div>


    <div class="lockButtons">

        <div class="lockButton">
            🔦
        </div>


        <div class="lockButton">
            📷
        </div>

    </div>

</section>


<!-- =====================================================
     HOME SCREEN
===================================================== -->

<section id="homeScreen">

    <div class="homeBackground"></div>


    <div class="homeScroll">

        <div
            class="appGrid"
            id="appGrid"
        ></div>

    </div>

</section>


<!-- =====================================================
     APP WINDOW
===================================================== -->

<div id="appWindow">

    <div
        class="appContent"
        id="appContent"
    ></div>

</div>


<!-- =====================================================
     TOUCH BLOCKER
===================================================== -->

<div id="blocker"></div>


<!-- =====================================================
     SYSTEM NAVIGATION
===================================================== -->

<div id="systemNavigation">

    <div id="navigationBar"></div>

</div>


</div>


<script>

/* =========================================================
   AIRIS OS
========================================================= */


/* =========================================================
   APP DATA
========================================================= */

const apps = [

    ["Pinterest","P"],
    ["Productivity","⌂"],
    ["Flashscore","◔"],
    ["YouTube","▶"],

    ["Music","♪"],
    ["Productivity","◉"],
    ["textPlus","text+"],
    ["Productivity","◇"],

    ["Productivity","◉"],
    ["Twitch","▣"],
    ["ChatGPT","◎"],
    ["Snapchat","👻"],

    ["Instagram","◎"],
    ["Telegram","➤"],
    ["WhatsApp","◉"],
    ["Skype","S"],

    ["Spotify","●"],
    ["Bolt","Bolt"],
    ["OnPhone","•••"],
    ["Preview","○"],

    ["Messenger","●"],
    ["Facebook","f"],
    ["Canva","Canva"],
    ["Settings","⚙"]

];


/* =========================================================
   ELEMENTS
========================================================= */

const lockScreen =
    document.getElementById("lockScreen");

const homeScreen =
    document.getElementById("homeScreen");

const appGrid =
    document.getElementById("appGrid");

const appWindow =
    document.getElementById("appWindow");

const appContent =
    document.getElementById("appContent");

const blocker =
    document.getElementById("blocker");

const lockTime =
    document.getElementById("lockTime");

const lockDate =
    document.getElementById("lockDate");

const statusTime =
    document.getElementById("statusTime");

const systemNavigation =
    document.getElementById("systemNavigation");

const navigationBar =
    document.getElementById("navigationBar");


/* =========================================================
   STATE
========================================================= */

let unlocked = false;

let currentApp = null;

let currentIconRect = null;

let animating = false;

let animationMultiplier = 1;


/* =========================================================
   ANIMATION
========================================================= */

const baseAnimation = 0.72;


/* =========================================================
   BUILD APPS
========================================================= */

function buildApps(){

    appGrid.innerHTML = "";


    apps.forEach(function(data,index){

        const name =
            data[0];

        const iconText =
            data[1];


        const app =
            document.createElement("div");

        app.className =
            "app";


        const hitbox =
            document.createElement("div");

        hitbox.className =
            "appHitbox";


        const icon =
            document.createElement("div");

        icon.className =
            "appIcon";

        icon.textContent =
            iconText;


        const label =
            document.createElement("div");

        label.className =
            "appName";

        label.textContent =
            name;


        hitbox.appendChild(icon);

        hitbox.appendChild(label);

        app.appendChild(hitbox);

        appGrid.appendChild(app);


        app.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                if(animating){
                    return;
                }

                openApp(
                    {
                        name:name,
                        index:index
                    },
                    app
                );

            }
        );

    });

}


/* =========================================================
   ICON RECT
========================================================= */

function getIconRect(appElement){

    const icon =
        appElement.querySelector(
            ".appIcon"
        );

    if(!icon){
        return null;
    }

    return icon.getBoundingClientRect();

}


/* =========================================================
   LOCK SCREEN SWIPE
========================================================= */

let startY = 0;

let currentY = 0;

let dragging = false;


lockScreen.addEventListener(
    "touchstart",
    function(event){

        if(unlocked){
            return;
        }

        if(!event.touches.length){
            return;
        }

        startY =
            event.touches[0].clientY;

        currentY =
            startY;

        dragging = true;

    },
    {
        passive:false
    }
);


lockScreen.addEventListener(
    "touchmove",
    function(event){

        if(unlocked || !dragging){
            return;
        }

        event.preventDefault();

        currentY =
            event.touches[0].clientY;

        const distance =
            startY - currentY;


        if(distance > 0){

            const move =
                Math.min(
                    distance,
                    window.innerHeight
                );

            lockScreen.style.transform =
                "translateY(-" +
                move +
                "px)";

        }

    },
    {
        passive:false
    }
);


lockScreen.addEventListener(
    "touchend",
    function(){

        if(unlocked){
            return;
        }

        dragging = false;


        const distance =
            startY - currentY;


        if(distance >= 80){

            unlock();

        }else{

            lockScreen.style.transform =
                "";

        }

    },
    {
        passive:false
    }
);


/* =========================================================
   POINTER FALLBACK
========================================================= */

lockScreen.addEventListener(
    "pointerdown",
    function(event){

        if(unlocked){
            return;
        }

        if(event.pointerType === "touch"){
            return;
        }

        startY =
            event.clientY;

        currentY =
            event.clientY;

        dragging = true;

    }
);


lockScreen.addEventListener(
    "pointermove",
    function(event){

        if(unlocked || !dragging){
            return;
        }

        if(event.pointerType === "touch"){
            return;
        }

        currentY =
            event.clientY;


        const distance =
            startY - currentY;


        if(distance > 0){

            lockScreen.style.transform =
                "translateY(-" +
                Math.min(
                    distance,
                    window.innerHeight
                ) +
                "px)";

        }

    }
);


lockScreen.addEventListener(
    "pointerup",
    function(){

        if(unlocked){
            return;
        }

        if(
            startY - currentY >= 80
        ){

            unlock();

        }else{

            lockScreen.style.transform =
                "";

        }

        dragging = false;

    }
);


/* =========================================================
   UNLOCK
========================================================= */

function unlock(){

    if(unlocked){
        return;
    }

    unlocked = true;


    lockScreen.classList.add(
        "unlocking"
    );


    /*
     * Navigation baru muncul
     * setelah lock screen keluar.
     */

    setTimeout(
        function(){

            homeScreen.classList.add(
                "visible"
            );


            systemNavigation.classList.add(
                "visible"
            );

        },
        180
    );

}


/* =========================================================
   OPEN APP
========================================================= */

function openApp(app,appElement){

    if(animating){
        return;
    }


    const rect =
        getIconRect(
            appElement
        );


    if(!rect){
        return;
    }


    /*
     * SIMPAN APP YANG DIBUKA
     *
     * Posisi ini tidak akan berubah
     * selama aplikasi terbuka.
     */

    currentApp =
        app;

    currentIconRect = {

        left:rect.left,

        top:rect.top,

        width:rect.width,

        height:rect.height

    };


    animating = true;


    blocker.classList.add(
        "active"
    );


    appContent.innerHTML =
        "";


    appWindow.classList.remove(
        "showContent"
    );


    /*
     * MULAI DARI IKON
     */

    appWindow.style.transition =
        "none";

    appWindow.style.left =
        currentIconRect.left +
        "px";

    appWindow.style.top =
        currentIconRect.top +
        "px";

    appWindow.style.width =
        currentIconRect.width +
        "px";

    appWindow.style.height =
        currentIconRect.height +
        "px";

    appWindow.style.borderRadius =
        "17px";


    appWindow.classList.add(
        "open"
    );


    void appWindow.offsetWidth;


    const duration =
        baseAnimation *
        animationMultiplier;


    appWindow.style.transition =
        "left " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "top " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "width " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "height " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "border-radius " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)";


    requestAnimationFrame(
        function(){

            appWindow.style.left =
                "0px";

            appWindow.style.top =
                "0px";

            appWindow.style.width =
                window.innerWidth +
                "px";

            appWindow.style.height =
                window.innerHeight +
                "px";

            appWindow.style.borderRadius =
                "0px";

        }
    );


    setTimeout(
        function(){

            renderApp(
                currentApp
            );


            appWindow.classList.add(
                "showContent"
            );


            animating = false;

            blocker.classList.remove(
                "active"
            );

        },
        duration * 1000 + 40
    );

}


/* =========================================================
   CLOSE APP
========================================================= */

function closeApp(){

    if(!currentApp){
        return;
    }

    if(animating){
        return;
    }

    if(!currentIconRect){
        return;
    }


    animating = true;


    blocker.classList.add(
        "active"
    );


    /*
     * KONTEN MENJADI PUTIH
     */

    appWindow.classList.remove(
        "showContent"
    );


    const duration =
        baseAnimation *
        animationMultiplier;


    appWindow.style.transition =
        "left " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "top " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "width " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "height " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)," +

        "border-radius " +
        duration +
        "s cubic-bezier(.22,.8,.25,1)";


    /*
     * KEMBALI KE ICON
     *
     * Tidak mencari icon baru.
     */

    requestAnimationFrame(
        function(){

            appWindow.style.left =
                currentIconRect.left +
                "px";

            appWindow.style.top =
                currentIconRect.top +
                "px";

            appWindow.style.width =
                currentIconRect.width +
                "px";

            appWindow.style.height =
                currentIconRect.height +
                "px";

            appWindow.style.borderRadius =
                "17px";

        }
    );


    setTimeout(
        function(){

            appWindow.classList.remove(
                "open"
            );


            appContent.innerHTML =
                "";


            currentApp =
                null;

            currentIconRect =
                null;

            animating =
                false;


            blocker.classList.remove(
                "active"
            );

        },
        duration * 1000 + 40
    );

}


/* =========================================================
   NAVIGATION BAR
========================================================= */

let navigationStartY = 0;

let navigationDragging = false;


/*
 * TOUCH START
 */

navigationBar.addEventListener(
    "touchstart",
    function(event){

        if(!unlocked){
            return;
        }

        navigationStartY =
            event.touches[0].clientY;

        navigationDragging = true;

    },
    {
        passive:true
    }
);


/*
 * TOUCH MOVE
 */

navigationBar.addEventListener(
    "touchmove",
    function(event){

        if(!navigationDragging){
            return;
        }

        const y =
            event.touches[0].clientY;

        const distance =
            navigationStartY - y;


        /*
         * Bar ikut naik sedikit
         */

        if(distance > 0){

            navigationBar.style.transform =
                "translateY(-" +
                Math.min(
                    distance,
                    35
                ) +
                "px)";

        }

    },
    {
        passive:true
    }
);


/*
 * TOUCH END
 */

navigationBar.addEventListener(
    "touchend",
    function(event){

        if(!navigationDragging){
            return;
        }

        navigationDragging = false;


        const endY =
            event.changedTouches[0].clientY;

        const distance =
            navigationStartY - endY;


        navigationBar.style.transform =
            "";


        /*
         * Kalau sedang di aplikasi:
         *
         * swipe UP
         * atau TAP
         *
         * = kembali Home
         */

        if(currentApp){

            if(
                distance > 35 ||
                Math.abs(distance) < 15
            ){

                closeApp();

            }

        }

    },
    {
        passive:true
    }
);


/*
 * TAP BAR
 */

navigationBar.addEventListener(
    "click",
    function(){

        if(
            currentApp &&
            !animating
        ){

            closeApp();

        }

    }
);


/* =========================================================
   APP SWIPE DOWN
========================================================= */

let appStartY = 0;


appWindow.addEventListener(
    "touchstart",
    function(event){

        if(
            !currentApp ||
            animating
        ){
            return;
        }


        appStartY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


appWindow.addEventListener(
    "touchend",
    function(event){

        if(
            !currentApp ||
            animating
        ){
            return;
        }


        const endY =
            event.changedTouches[0].clientY;


        const distance =
            endY - appStartY;


        /*
         * Opsional:
         * swipe ke bawah juga bisa tutup.
         */

        if(distance > 90){

            closeApp();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   RENDER APP
========================================================= */

function renderApp(app){

    if(!app){
        return;
    }


    if(
        app.name === "Settings"
    ){

        renderSettings();

        return;

    }


    appContent.innerHTML =

        '<div class="appHeader">' +

            escapeHTML(
                app.name
            ) +

        '</div>' +


        '<div class="appBody">' +

            '<div class="card">' +

                '<div class="cardTitle">' +

                    escapeHTML(
                        app.name
                    ) +

                '</div>' +

                '<div class="cardText">' +

                    'AIRIS OS Simulator' +

                '</div>' +

            '</div>' +


            '<div class="card">' +

                '<div class="cardTitle">' +

                    'Coming Soon' +

                '</div>' +

                '<div class="cardText">' +

                    'Tampilan aplikasi lengkap akan ' +
                    'ditambahkan pada tahap berikutnya.' +

                '</div>' +

            '</div>' +

        '</div>';

}


/* =========================================================
   SETTINGS
========================================================= */

function renderSettings(){

    appContent.innerHTML =

        '<div class="appHeader">' +
            'Settings' +
        '</div>' +


        '<div class="appBody">' +

            '<div class="settingRow">' +

                '<div class="settingLabel">' +
                    'AIRIS OS' +
                '</div>' +

                '<div class="settingValue">' +
                    'Simulator' +
                '</div>' +

            '</div>' +


            '<div style="padding-top:25px;">' +

                '<div class="cardTitle">' +
                    'Animation Speed' +
                '</div>' +


                '<div class="speedButtons">' +

                    '<button ' +
                        'class="speedButton" ' +
                        'data-speed="slow">' +
                        'Slow' +
                    '</button>' +


                    '<button ' +
                        'class="speedButton active" ' +
                        'data-speed="normal">' +
                        'Normal' +
                    '</button>' +


                    '<button ' +
                        'class="speedButton" ' +
                        'data-speed="fast">' +
                        'Fast' +
                    '</button>' +

                '</div>' +

            '</div>' +

        '</div>';


    const buttons =
        appContent.querySelectorAll(
            ".speedButton"
        );


    buttons.forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const speed =
                        button.dataset.speed;


                    if(
                        speed === "slow"
                    ){

                        animationMultiplier =
                            1.35;

                    }


                    if(
                        speed === "normal"
                    ){

                        animationMultiplier =
                            1;

                    }


                    if(
                        speed === "fast"
                    ){

                        animationMultiplier =
                            .7;

                    }


                    buttons.forEach(
                        function(other){

                            other.classList.remove(
                                "active"
                            );

                        }
                    );


                    button.classList.add(
                        "active"
                    );

                }
            );

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2,"0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const time =
        h + ":" + m;


    lockTime.textContent =
        time;


    statusTime.textContent =
        time;


    lockDate.textContent =
        now.toLocaleDateString(
            "en-US",
            {
                weekday:"short",
                month:"short",
                day:"numeric"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================================================
   START
========================================================= */

buildApps();

</script>
